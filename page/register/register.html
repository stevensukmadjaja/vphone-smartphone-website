<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Register - V-Phone</title>
    <link rel="stylesheet" href="register.css" />
</head>

<body>
    <!-- HEADER -->
    <header class="modern-header">
        <div class="logo">V-Phone</div>

        <nav>
            <a href="../home/index.html">Home</a>
            <a href="../product/product.html">Product</a>
            <a href="../promotions/promotions.html">Promotions</a>
            <a href="../about/about.html">About Us</a>
            <a href="../register/register.html" class="active">Register</a>
        </nav>

        <!-- Hamburger Menu Button -->
        <div class="hamburger" id="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </header>

    <!-- Mobile Navigation Overlay -->
    <div class="nav-mobile" id="navMobile">
        <a href="../home/index.html">Home</a>
        <a href="../product/product.html">Product</a>
        <a href="../promotions/promotions.html">Promotions</a>
        <a href="../about/about.html">About Us</a>
        <a href="../register/register.html" class="active">Register</a>
    </div>

    <!-- MAIN CONTENT -->
    <main class="main">
        <div class="form-card">
            <h1>Join the future of smart shopping</h1>
            <p class="subtitle">Get exclusive offers and personalized deals</p>

            <form id="registerForm" novalidate>
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" />
                    <small class="error" id="nameError"></small>
                </div>

                <div class="form-group">
                    <label>Gender</label>
                    <div class="gender-options">
                        <label><input type="radio" name="gender" value="Male" /> Male</label>
                        <label><input type="radio" name="gender" value="Female" /> Female</label>
                    </div>
                    <small class="error" id="genderError"></small>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" />
                    <small class="error" id="emailError"></small>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" />
                    <small class="error" id="passwordError"></small>
                </div>

                <div class="form-group">
                    <label for="confirm">Password Confirmation</label>
                    <input type="password" id="confirm" />
                    <small class="error" id="confirmError"></small>
                </div>

                <button type="submit">Register</button>
            </form>
        </div>
    </main>

    <!-- FOOTER -->
    <footer>
        <a href="../about/about.html" class="footer-link">V-Phone — Connecting Ur Future</a>
    </footer>

    <script src="register.js"></script>
</body>

</html>
